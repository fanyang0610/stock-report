# Weights, thresholds and retention periods. Method: docs/PLAN.md.

[universe]
top_n = 800
min_listing_days = 365
history_days = 385            # calendar days of daily prices kept (12-1 momentum needs ~252 trading days)
exclude_name_patterns = ["ST", "退"]
us_candidates = 1100          # US: largest ordinary shares whose prices and fundamentals are kept (top_n after filters)
hk_candidates = 1200          # HK: largest ordinary shares whose prices and consensus are kept (top_n after filters)
cash_conv_range = [-1.0, 3.0] # operating cash flow / net profit is clipped to this range ...
cash_conv_min_margin = 0.02   # ... and left out (NaN) when the net margin is below this

[universe.min_turnover]       # 20-day average daily turnover, quote currency
cn = 50_000_000
hk = 20_000_000
us = 10_000_000

[peers]                       # the score's financials (CN: 申万 银行 and 非银金融, universe.CN_FINANCIAL)
# US: exact Nasdaq industries, plus SEC SIC lenders and insurers (universe.us_financial). "Specialty Insurers" is left
# out: in the US universe it holds the insurance brokers (Marsh, Aon, Gallagher, WTW, Brown & Brown), fee businesses.
financial_industries_us = ["Major Banks", "Commercial Banks", "Savings Institutions", "Investment Bankers/Brokers/Service",
                           "Property-Casualty Insurers", "Life Insurance", "Accident &Health Insurance"]
# HK: exact sub-industries (last level of Eastmoney's HK industry type): banks, insurers, brokers, consumer lenders
# and lessors. HKEX and asset managers are fee businesses, scored like other companies.
financial_industries_hk = ["区域性银行", "综合性银行", "人寿与健康保险", "再保险", "多元化保险", "财产与意外伤害保险",
                           "投资银行业与经纪业", "综合性资本市场", "消费信贷", "特殊金融服务"]

[lists]                       # PLAN.md, "Lists"
buys = 20                     # from the whole scored market, places per sector by its free-float share (lists.positions)
screen = 0.05                 # Quantitative Value: the 5% most likely distressed or with the largest accruals not bought
small_share = { hk = 0.05 }   # HK small caps not bought: the last 5% of value (Hang Seng's SmallCap band, lists.buyable)
top_share = 0.2               # holding rule: at the anniversary keep a name still in its sector's top fifth
avoid = 10
per_sector = 2                # avoid names per sector
avoid_largest = 400

[cards]
heavy_debt = 0.7              # debt ÷ assets at or above this is a key risk (not financials): SASAC's 70% warning line
big_fall = -0.3               # a 6-month return at or below this is a key risk (PLAN.md, "Cards")

[fetch]
fundamentals_refresh_days = 7
quarters_kept = 7             # report periods fetched for trailing-12-month numbers

[retention]                   # days
raw = 7
snapshots = 400
reports = 90
logs = 30

[storage]
warn_gb = 2.0

[notes]                       # DeepSeek (PLAN.md, "Results review")
base_url = "https://api.deepseek.com"
model = "deepseek-flash"      # from GET /models on 2026-10-25 (deepseek-flash = DeepSeek-V4.1-Flash, deepseek-v4-pro)

[review]                      # results review, on request (PLAN.md, "Results review"; review.py)
budget = 20                   # seconds the keyword reply waits for reviews; the rest finish in the background
workers = 10                  # DeepSeek calls at a time
timeout = 30                  # seconds per call
max_tokens = 600
keep_days = 7                 # a cached review is redone after this, or for a new filing or headline or a new list
filing_days = 90              # non-routine filings read ...
max_filings = 20              # ... at most this many, newest first
headline_days = 30            # headlines read ...
max_headlines = 15            # ... at most this many, newest first
filing_workers = 4            # per-stock filing searches at a time while the build gathers sources

[crosscheck]                  # data cross-checks and drift alarms (PLAN.md Method 13)
cn_tencent = 1200             # CN: the largest A-shares Tencent's quotes are fetched for (the universe reached rank 842)
agree = 0.01                  # two sources within this agree (financial-data) ...
large = 0.05                  # ... above this a figure isn't usable (counts: agree / small gap / large gap)
drop_gap = 0.2                # a valuation input this far off its second source (and unconfirmed) drops the stock
                              # (rule 5). 0.05 = financial-data's rule; measured 5-15% gaps are mostly definitions
                              # (minority interests, perpetuals, financials' revenue): PLAN.md Method 13
units_ratio = 20              # consensus EPS this many times off the trailing EPS on a 5%+ net margin: a units error
basis_ratio = 2               # this year's consensus this far from the trailing EPS: adjusted vs GAAP (counted only)
drift = { value = 0.05, profit = 0.05, book = 0.05, consensus = 0.2 }  # day-over-day alarms

[deepdive]                    # deep-dive lane (AGENTS.md rule 3; deepdive.py), after the results review
per_day = 3                   # new filings read per market a day (cached filings are reused at no cost)
max_chars = 80000             # filing text sent to DeepSeek: all of it if shorter, else windows around keywords
window = [1500, 2500]         # characters before / after each keyword
workers = 3
one_off_share = 0.3           # non-recurring items this share of the period's profit: a soft concern (one-off gain)
data_gap = 0.2                # the report's net profit this far off the card's figure: data_suspect (PLAN.md)
keep_days = 400               # cached filings older than this are deleted
