# Weights, thresholds and retention periods. Method: docs/PLAN.md.

[universe]
top_n = 800
min_listing_days = 365
history_days = 385            # calendar days of daily prices kept (12-1 momentum needs ~252 trading days)
exclude_name_patterns = ["ST", "退"]
us_candidates = 1100          # US: largest ordinary shares whose prices and fundamentals are kept (top_n after filters)
hk_candidates = 1200          # HK: largest ordinary shares whose prices and consensus are kept (top_n after filters)
cash_conv_range = [-1.0, 3.0] # operating cash flow / net profit is clipped to this range ...
cash_conv_min_margin = 0.02   # ... and left out (NaN) when the net margin is below this

[universe.min_turnover]       # 20-day average daily turnover, quote currency
cn = 50_000_000
hk = 20_000_000
us = 10_000_000

[peers]
min_group_size = 8
financial_industries = ["银行", "证券", "保险"]   # substring match on the industry name
# US: exact Nasdaq industries. "Specialty Insurers" is left out: in the US universe it holds the insurance
# brokers (Marsh, Aon, Gallagher, WTW, Brown & Brown), fee businesses valued like other companies.
financial_industries_us = ["Major Banks", "Commercial Banks", "Savings Institutions", "Investment Bankers/Brokers/Service",
                           "Property-Casualty Insurers", "Life Insurance", "Accident &Health Insurance"]
# HK: exact sub-industries (last level of Eastmoney's HK industry type): banks, insurers and brokers.
# HKEX, asset managers, lessors and consumer lenders are valued like other companies, as in CN and US.
financial_industries_hk = ["区域性银行", "综合性银行", "人寿与健康保险", "再保险", "多元化保险", "财产与意外伤害保险",
                           "投资银行业与经纪业", "综合性资本市场"]

[value]
equity_premium = { cn = 0.06, hk = 0.06, us = 0.05 }
winsor = [0.02, 0.98]
growth_metric = "rev_growth"  # growth regressor in the P/E and P/S fits
ri_fade_years = 10            # residual income: ROE fades linearly to r over this many years
cross_check_max_gap = 0.5     # values pointing opposite ways and further apart than this -> 低信心
forward_weight = 0.5          # forward lens share of fair value when a stock has it
forward_min_analysts = 3

[score.weights]
value = 0.35
quality = 0.25
growth = 0.15
momentum = 0.15
risk = 0.10

[buckets]
per_bucket = 5
max_per_group = 2
runners_up = 10            # next-ranked names a flagged pick can be swapped for
buy_min_upside = 0.15
buy_min_momentum_z = -0.5
hold_quality_top = 0.30
hold_upside = [-0.10, 0.15]
sell_max_upside = -0.15
sell_quality_bottom = 0.40
sell_max_momentum_z = -0.5
sell_largest_n = 400

[fetch]
fundamentals_refresh_days = 7
quarters_kept = 7             # report periods fetched for trailing-12-month numbers

[retention]                   # days
raw = 7
snapshots = 400
reports = 90
logs = 30

[storage]
warn_gb = 2.0

[notes]                       # DeepSeek notes (PLAN.md Method section 8)
base_url = "https://api.deepseek.com"
model = "deepseek-flash"      # from GET /models on 2026-10-17 (deepseek-flash, deepseek-v4-pro)
temperature = 0.0
spike_growth = 1.0            # one_off_gain check 1: net profit growth above this ...
spike_cash_conv = 0.5         # ... with operating cash flow / net profit below this (non-financials)
eps_fall = 0.6                # check 2: next year's consensus EPS below this share of trailing EPS
title_gap = 0.3               # check 3: profit growth minus revenue growth, needed before a one-off in the titles counts
title_days = 60
max_titles = 10
workers = 4

[crosscheck]                  # data cross-checks and drift alarms (PLAN.md Method 13)
cn_tencent = 1200             # CN: the largest A-shares Tencent's quotes are fetched for (the universe reached rank 842)
agree = 0.01                  # two sources within this agree (financial-data) ...
large = 0.05                  # ... above this a figure isn't usable (counts: agree / small gap / large gap)
drop_gap = 0.2                # a valuation input this far off its second source (and unconfirmed) drops the stock
                              # (rule 5). 0.05 = financial-data's rule; measured 5-15% gaps are mostly definitions
                              # (minority interests, perpetuals, financials' revenue): PLAN.md Method 13
units_ratio = 20              # consensus EPS this many times off the trailing EPS on a 5%+ net margin: a units error
basis_ratio = 2               # this year's consensus this far from the trailing EPS: adjusted vs GAAP (counted only)
drift = { value = 0.05, profit = 0.05, book = 0.05, consensus = 0.2, fair_value = 0.3 }  # day-over-day alarms

[shadow]                      # the v3 shadow lists' bucket rules (v2's, as Phase 9 calibrated them; PLAN.md Method 12)
buy_min_upside = 0.20
buy_largest_n = { cn = 300, hk = 200, us = 300 }   # buys only among the market's largest companies (your choice, Phase 9 review)
buy_home_only = true          # US buys only among US listings (foreign buys trailed US buys by 11-12 points in the backtest)
momentum_weight = 0.5         # momentum z added to the buy ranking (range-weighted upside in sd units; Phase 9)
hold_max_abs_upside = 0.15
sell_max_upside = -0.25

[v3]                          # valuation v3, the Phase 13 redesign (PLAN.md Method 16), in shadow mode next to v1
tolerance = { cn = 0.1, hk = 0.1, us = 0.25 }  # base rates: profit keeps up a rate while its sum over the years is at most this short
min_starts = 60               # a base-rate cell needs this many company-years, else the next coarser cell
fade_years = { cn = 3, hk = 3, us = 15 }  # after the duration (growth) and the 10-year base-rate path (ROE), fade to the long-run levels
book_light_roe = 0.4          # negative book (no loss in 5 years) or a 5-year ROE above this: valued on the capital earning 40%
growth = [-0.10, 0.40]        # the growth rate held during the duration (analysts' years 1-3 or the own trend)
long_growth = { cn = 0.03, hk = 0.03, us = 0.04 }   # long-run nominal growth (as v2)
long_roe = { cn = "market", hk = "market", us = "r" }  # long-run ROE: "market" (the largest third's median) or "r" (no excess)
industry_lambda = { cn = 0.75, hk = 0.5, us = 0.5 }  # share of an industry's implied premium over the market's rate taken as risk
analysts_years = { cn = false, hk = false, us = false }  # covered stocks keep analysts' 3 years before the base-rate duration takes over
drift = { cn = true, hk = true, us = true }  # base-rate ROE paths chain the cell's median yearly change (false: persistence toward the cell mean only)
tail_exposure = { cn = 0, hk = 0, us = 100 }  # a cell's 10-30 year hazard needs this many company-years at risk behind it, else the market's at the same rate (0: off; in-sample)
industry_cells = { cn = false, hk = false, us = false }  # base rates: an industry (CN 申万 L2, HK level 2) × growth × ROE cell first, where it has the starts
country_lambda = 0.5          # US: share of a foreign listing's country premium (its country's implied rate over home listings')

[trend]                       # business trend (PLAN.md Method 16, "Trend first"); a vote is +1 / -1 outside its dead band
dead = { rev = 0.05, profit = 0.2, roe = 0.02, momentum = 0.1, revision = 0.02 }  # growth acceleration, ROE change, 12-1 return over the median, 4-week EPS revision
evidence = { cn = ["rev", "profit", "roe", "momentum", "revision"], hk = ["rev", "profit", "roe", "momentum", "revision"], us = ["momentum", "revision"] }  # the votes the class counts (US in-sample; CN, HK: all, descriptive)
need = { cn = 2, hk = 2, us = 1 }   # improving at a vote sum >= need, deteriorating at <= -need
buy = { cn = "stable", hk = "stable", us = "stable" }  # strict buys from "improving" only, or "stable" too; never deteriorating
map = { cn = false, hk = false, us = true }   # the trend × valuation map for the shadow lists (false: v2's bucket rules); in-sample, BACKTEST.md 15

[events]                      # event layer (PLAN.md Method 14)
backfill_days = 10            # the first fetch reads this many days back (CN ~30 s a day); later the days since the last
keep_days = 120               # rows older than this are dropped from data/events/<market>.csv.gz
recent_days = 30              # 近期事件: non-routine filings of the last 30 days, newest first ...
max_lines = 3                 # ... at most this many on a card
move_days = 5                 # abnormal move: the 1-5-day return over the market index ...
move_z = 2.5                  # ... at least this many sd of the stock's daily excess returns over the past year

[deepdive]                    # deep-dive lane, tier 3 (PLAN.md Method 15; docs/REVIEW.md A3)
per_day = 3                   # new filings read per market a day (cached filings are reused at no cost)
runners_up = 2                # the first runners-up per bucket can be triggered too (they may replace a swapped pick)
value_ratio = 2.0             # trigger: v1 fair value ≥ 2× or ≤ ½ the price without v2's 高
strong_upside = 0.3           # trigger: v2's quality screen fails on a buy/hold with at least this upside
share_change = 0.4            # trigger: 5-year share-count change (v2_dilution, US) above this
archetypes = { insurer = ["保险", "Insur"], property = ["地产", "Real Estate"], holdco = ["综合", "Conglomer"] }
max_chars = 80000             # filing text sent to DeepSeek: all of it if shorter, else windows around keywords
window = [1500, 2500]         # characters before / after each keyword
workers = 3
one_off_share = 0.3           # buy/hold vetoed when non-recurring items are this share of the period's profit
related_party = 0.3           # 低信心 when sales to related parties are this share of revenue
material = 0.1                # a deal or contract this share of revenue or market value is 重大
keep_days = 400               # cached filings older than this are deleted
