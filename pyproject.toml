[project]
name = "stockreport"
version = "0.0.0"  # not maintained: the version is the latest git tag (see README "Versions and releases")
description = "Daily Buy/Hold/Sell stock ratings for China A-shares, US and Hong Kong, delivered over WeChat"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pandas>=3.0.6",
    "pypdf>=6.21.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "xlrd>=2.0.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
